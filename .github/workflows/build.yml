
name: Build Luna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WhippleHub_Android_Project_Fixed.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root"
            ls -la
            exit 1
          fi
          mkdir -p luna-src
          unzip -o "$ZIP_FILE" -d luna-src
          PROJECT_DIR=$(find luna-src -name settings.gradle.kts -print | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts in the ZIP"
            find luna-src -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Android-APK
          path: '${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
