
name: Build Luna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Luna_Android_Starter_Project_Phone_Build.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      
      - name: Prepare project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root"
            ls -la
            exit 1
          fi
          mkdir luna-src
          unzip "$ZIP_FILE" -d luna-src
          PROJECT_DIR=$(find luna-src -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts in the ZIP"
            find luna-src -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
